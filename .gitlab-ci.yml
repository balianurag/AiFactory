# =============================================================================
# AI Factory — GitLab CI/CD Pipeline
#
# Lint & type-check are handled locally by pre-commit hooks (ruff + mypy).
# CI focuses on test → build only.
# =============================================================================

stages:
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHON_VERSION: "3.13"

# Cache uv + pip downloads across pipeline runs
cache:
  key: "${CI_COMMIT_REF_SLUG}-uv-v2"
  paths:
    - .cache/pip
    - .cache/uv

# Base job template — installs uv + project deps
.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install uv --quiet
    - uv venv .venv --allow-existing
    - uv sync --frozen --dev
    - source .venv/bin/activate

# ── Stage: Test ───────────────────────────────────────────────────────────────

test:
  extends: .python-base
  stage: test
  script:
    - uv run pytest tests/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

test-coverage:
  extends: .python-base
  stage: test
  script:
    - uv run pytest tests/ --cov=aifactory --cov-report=term --cov-report=html:htmlcov --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  coverage: '/TOTAL.*\s+(\d+%)/'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Stage: Build ──────────────────────────────────────────────────────────────

build-package:
  extends: .python-base
  stage: build
  script:
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
