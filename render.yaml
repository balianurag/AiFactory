# =============================================================================
# AiFactory — Render Deployment (Infrastructure-as-Code)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy steps:
#   1. Push this repo to GitHub / GitLab
#   2. Connect repo in Render dashboard → "New Blueprint"
#   3. Set secret env vars in the Render dashboard (marked sync: false)
#   4. Push to main — autoDeploy triggers automatically
# =============================================================================

services:
  # ── Web Service: FastAPI + WebSocket API ─────────────────────────────────────
  - type: web
    name: aifactory-api
    runtime: python
    region: oregon            # us-west-2 — low latency to Vercel iad1
    plan: starter             # $7/mo — always-on (free tier spins down after 15min)

    buildCommand: |
      pip install uv
      uv sync --frozen --no-dev

    startCommand: >
      .venv/bin/uvicorn aifactory.api.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --timeout-keep-alive 75

    healthCheckPath: /api/health

    envVars:
      # ── OpenRouter (set value in Render dashboard — do NOT commit) ──────────
      - key: OPENROUTER_API_KEY
        sync: false           # paste your rotated key in Render dashboard

      # ── Optional direct provider keys (only if bypassing OpenRouter) ────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Model routing (uses OpenRouter by default) ───────────────────────────
      - key: AIFACTORY_PREMIUM_MODEL
        value: openrouter/anthropic/claude-sonnet-4-5
      - key: AIFACTORY_STANDARD_MODEL
        value: openrouter/google/gemini-2.0-flash-001
      - key: AIFACTORY_BUDGET_MODEL
        value: openrouter/google/gemini-2.0-flash-001

      # ── Qdrant Vector DB ──────────────────────────────────────────────────────
      # Free tier at https://cloud.qdrant.io — 1 cluster, 1 GB storage
      # If left unset, backend falls back to in-memory Qdrant (no persistence)
      - key: QDRANT_URL
        sync: false           # e.g. https://<id>.us-east4-0.gcp.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false

      # ── Budget / Limits ───────────────────────────────────────────────────────
      - key: AIFACTORY_MAX_BUDGET_USD
        value: "5.0"
      - key: AIFACTORY_MAX_ITERATIONS
        value: "50"
      - key: AIFACTORY_MAX_TOTAL_TOKENS
        value: "500000"

      # ── App runtime ───────────────────────────────────────────────────────────
      - key: AIFACTORY_LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"

    autoDeploy: true          # triggers on every push to main

# =============================================================================
# Deployment notes
# =============================================================================
#
# LOCAL DEV  →  run DBs in Docker:
#   docker compose -f docker-compose.dbs.yml up -d
#   cp .env.example .env && nano .env  (add OPENROUTER_API_KEY + QDRANT_URL)
#   uv run uvicorn aifactory.api.main:app --reload
#
# RENDER PROD → Qdrant:
#   - Sign up at cloud.qdrant.io (free 1 GB cluster)
#   - Copy cluster URL + API key into Render env vars above
#   - Without QDRANT_URL set, backend uses in-memory Qdrant (data lost on restart)
#
# CORS:
#   - Add your Vercel frontend URL to allow_origins in src/aifactory/api/main.py
#   - e.g. https://aifactory-ui.vercel.app
#
# TIMEOUTS:
#   - Long LLM tasks can exceed Render's 10-min HTTP timeout
#   - Always use WebSocket /api/ws/{task_id} for real-time streaming
