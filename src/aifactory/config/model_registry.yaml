# =============================================================================
# Model Registry — Ability-Scored Models for AI Factory
#
# Used by core/model_selector.py for dynamic model selection.
# Models available via direct API keys (OpenAI, Anthropic, Google) or
# via a LiteLLM proxy (LITELLM_API_BASE env var).
#
# Abilities (0–3):
#   0 — bad at this / should not be used for it
#   1 — can do it (adequate)
#   2 — good at it (reliable)
#   3 — will crush it (exceptional)
#
#   reasoning          — logical analysis, multi-step deduction, planning
#   coding             — code generation, debugging, refactoring
#   math               — mathematical reasoning and computation
#   writing            — prose quality, tone, creative and technical writing
#   instruction_following — adhering to complex structured instructions precisely
#   tool_use           — structured output, function calling, schema compliance
#   knowledge          — breadth and accuracy of factual/world knowledge
#   speed              — response latency (3 = fastest)
#   cost_efficiency    — cost per token (3 = cheapest)
#   context_handling   — effectively utilising long context windows
# =============================================================================

abilities:
  - reasoning
  - coding
  - math
  - writing
  - instruction_following
  - tool_use
  - knowledge
  - speed
  - cost_efficiency
  - context_handling

