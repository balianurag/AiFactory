# =============================================================================
# AI Factory — Model Registry & Role Assignments
# =============================================================================
# All model IDs use LiteLLM / OpenRouter format.
# Pricing is per 1M tokens (input / output) in USD — updated March 2026.
#
# This file is the single source of truth for:
#   1. tiers         — backward-compatible tier definitions (settings.py defaults)
#   2. role_tier_map — which tier each agent role uses by default
#   3. allowed_models — curated per-role approved model list (like AWS Bedrock)
#   4. metadata       — display info served by GET /api/models to the UI picker
# =============================================================================

# ── Tier Defaults (backward-compatible) ──────────────────────────────────────
tiers:
  premium:
    description: "Master Researcher, Orchestrator, PM, Assessors — highest reasoning"
    default: "openrouter/anthropic/claude-sonnet-4-5-20250514"
    models:
      - name: "openrouter/anthropic/claude-opus-4-5-20251101"
        input_cost_per_1m: 15.00
        output_cost_per_1m: 75.00
        context_window: 200000
        supports_structured_output: true
      - name: "openrouter/anthropic/claude-sonnet-4-5-20250514"
        input_cost_per_1m: 3.00
        output_cost_per_1m: 15.00
        context_window: 200000
        supports_structured_output: true
      - name: "openrouter/openai/gpt-4o"
        input_cost_per_1m: 2.50
        output_cost_per_1m: 10.00
        context_window: 128000
        supports_structured_output: true
      - name: "openrouter/google/gemini-2.5-pro"
        input_cost_per_1m: 1.25
        output_cost_per_1m: 10.00
        context_window: 1000000
        supports_structured_output: true
      - name: "openrouter/x-ai/grok-3"
        input_cost_per_1m: 3.00
        output_cost_per_1m: 15.00
        context_window: 131072
        supports_structured_output: true

  standard:
    description: "Team Leads — fast coordination, moderate cost"
    default: "openrouter/google/gemini-2.5-flash"
    models:
      - name: "openrouter/anthropic/claude-haiku-3-5-20241022"
        input_cost_per_1m: 0.80
        output_cost_per_1m: 4.00
        context_window: 200000
        supports_structured_output: true
      - name: "openrouter/google/gemini-2.5-flash"
        input_cost_per_1m: 0.15
        output_cost_per_1m: 0.60
        context_window: 1000000
        supports_structured_output: true
      - name: "openrouter/openai/gpt-4o-mini"
        input_cost_per_1m: 0.15
        output_cost_per_1m: 0.60
        context_window: 128000
        supports_structured_output: true

  budget:
    description: "Workers — optimise for throughput and cost"
    default: "openrouter/google/gemini-2.5-flash"
    models:
      - name: "openrouter/google/gemini-2.5-flash"
        input_cost_per_1m: 0.15
        output_cost_per_1m: 0.60
        context_window: 1000000
        supports_structured_output: true
      - name: "openrouter/openai/gpt-4o-mini"
        input_cost_per_1m: 0.15
        output_cost_per_1m: 0.60
        context_window: 128000
        supports_structured_output: true
      - name: "openrouter/deepseek/deepseek-coder-v3"
        input_cost_per_1m: 0.014
        output_cost_per_1m: 0.28
        context_window: 128000
        supports_structured_output: true
      - name: "openrouter/meta-llama/llama-3.3-70b-instruct"
        input_cost_per_1m: 0.10
        output_cost_per_1m: 0.30
        context_window: 131072
        supports_structured_output: false

# ── Role → Tier Mapping ───────────────────────────────────────────────────────
role_tier_map:
  master_researcher:      premium
  assessor:               premium
  devils_advocate:        premium
  project_manager:        premium
  senior_project_manager: premium
  team_lead:              standard
  worker:                 budget
  consolidator:           premium
  judge:                  standard

# ── Allowed Models Per Agent Persona ─────────────────────────────────────────
# This is the curated allow-list: agents can ONLY use models from their role's list.
# Any model outside this list requires a manual approval process (Phase 4).
# New providers/models get added here after evaluation — do NOT add directly
# to settings without updating this list.

allowed_models:

  orchestrator:
    # Master Researcher / Senior PM — highest reasoning, big-picture synthesis
    description: "Top-tier reasoning for orchestrating multiple agent teams"
    models:
      - "openrouter/anthropic/claude-opus-4-5-20251101"
      - "openrouter/openai/gpt-4o"
      - "openrouter/google/gemini-2.5-pro"

  project_manager:
    # Strategic planning and delegation — must produce structured PMPlan
    description: "Strategic coordination and project decomposition"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/gpt-4o"
      - "openrouter/google/gemini-2.5-pro"
      - "openrouter/x-ai/grok-3"

  devils_advocate:
    # Critical evaluation — needs contrarian, divergent reasoning
    description: "Critical evaluation and assumption challenging"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/o3-mini"
      - "openrouter/x-ai/grok-3"

  assessor:
    # Quality gate — needs rigorous, unbiased scoring
    description: "Objective quality assessment and review"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/gpt-4o"
      - "openrouter/openai/o3-mini"

  team_lead:
    # Tactical coordination — fast enough for tight feedback loops
    description: "Task decomposition and worker delegation"
    models:
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/openai/gpt-4o-mini"

  coder:
    # Code generation and debugging — accuracy beats raw speed here
    description: "Production code, debugging, and refactoring"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/gpt-4o"
      - "openrouter/deepseek/deepseek-coder-v3"
      - "openrouter/google/gemini-2.5-flash"

  researcher:
    # Research and analysis — long context + web access ideal
    description: "Deep analysis, literature review, and synthesis"
    models:
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/perplexity/sonar-pro"
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/google/gemini-2.5-pro"

  writer:
    # Documentation, reports, content — clarity and tone
    description: "Technical documentation and content generation"
    models:
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/openai/gpt-4o-mini"
      - "openrouter/google/gemini-2.5-flash"

  tester:
    # QA and edge case analysis — systematic and thorough
    description: "Test generation, QA review, and edge case analysis"
    models:
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/openai/gpt-4o-mini"

  reviewer:
    # Code review and quality gates — pattern recognition
    description: "Code review, security analysis, and standards compliance"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/gpt-4o"
      - "openrouter/anthropic/claude-haiku-3-5-20241022"

  architect:
    # System design — needs broad context and design pattern knowledge
    description: "System architecture and design decisions"
    models:
      - "openrouter/anthropic/claude-sonnet-4-5-20250514"
      - "openrouter/openai/gpt-4o"
      - "openrouter/google/gemini-2.5-pro"

  devops:
    # Infrastructure and deployment — practical, operational focus
    description: "Infrastructure, CI/CD, and deployment pipelines"
    models:
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/openai/gpt-4o-mini"

  data_analyst:
    # Data processing and statistical analysis
    description: "Data analysis, visualisation, and statistical modelling"
    models:
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/openai/gpt-4o-mini"
      - "openrouter/anthropic/claude-haiku-3-5-20241022"

  rl_judge:
    # Agent performance scoring — must be fast and consistent
    description: "Agent scoring, evaluation, and RL feedback"
    models:
      - "openrouter/google/gemini-2.5-flash"
      - "openrouter/anthropic/claude-haiku-3-5-20241022"
      - "openrouter/openai/gpt-4o-mini"

