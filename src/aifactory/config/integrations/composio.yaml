# Composio Integration — 1000+ tools via Composio Direct Execution API
#
# This is the default integration provider for AiFactory.
# Workers invoke Composio tools via ACTION: blocks in their output.
#
# Setup:
#   1. pip install composio (or uv add composio)
#   2. export COMPOSIO_API_KEY=<your-key>
#   3. composio add github  (connect your accounts via CLI)
#   4. Restart AiFactory — integrations auto-connect on startup

name: composio
display_name: Composio
category: devops
enabled: true
capabilities:
  - read
  - write
  - search
  - execute

auth_type: api_key
auth_env_var: COMPOSIO_API_KEY

# Toolkits to enable — workers will be told about these in their prompts.
# Add/remove as you connect accounts via `composio add <toolkit>`.
enabled_toolkits:
  - github
  - gitlab
  - jira
  - notion
  - gmail
  - linear
  - confluence
  - googledrive
  - googlecalendar

# Default Composio user_id for tool execution (MVP: single deployer).
# Phase 2: per-user auth via Composio Connect Links.
default_user_id: default

rate_limit_rpm: 100

extra:
  # Future: per-toolkit overrides, webhook configs, etc.
  {}
