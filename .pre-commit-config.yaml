# See https://pre-commit.com for more information
repos:
  # ── Ruff: lint + format ───────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── mypy: type checking (all source, not just schemas) ────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/aifactory/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - pydantic>=2.10.0
          - types-PyYAML
          - types-redis

  # ── File hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # ── Secrets detection ─────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (\.env\.example|tests/|scripts/)

  # ── Fast tests on changed files ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast unit tests)
        entry: python -m pytest tests/ -q --tb=short -x
        language: system
        pass_filenames: false
        # Only run when Python source files change
        types: [python]
        stages: [pre-commit]
