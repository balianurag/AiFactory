[project]
name = "aifactory"
version = "0.1.0"
description = "Self-assembling, self-optimising AI agent factory that turns raw ideas into production-grade output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anurag" }]

dependencies = [
    # Orchestration
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    # Observability
    "langsmith>=0.3.0",
    # LLM provider
    "openai>=1.40.0",
    # Structured output & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Vector DB (memory layers)
    "qdrant-client>=1.13.0",
    # PostgreSQL (persistent task store)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Redis (task cache + pub/sub)
    "redis[hiredis]>=5.0.0",
    # Async & concurrency
    "anyio>=4.8.0",
    # Config
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.0",
    # Utilities
    "rich>=13.9.0", # Beautiful terminal output
    "typer>=0.15.0", # CLI framework
    "tiktoken>=0.9.0", # Token counting
    "tenacity>=9.0.0", # Retry logic
    # HTTP API (Render deployment)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",

    # LlamaIndex — Memory query engine + embeddings
    "llama-index-core>=0.14.20",
    "llama-index-vector-stores-qdrant>=0.10.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-readers-file>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
# Heavy local-embedding deps (pulls torch + CUDA ~5GB).
# Only needed when LLAMAINDEX_EMBEDDING_PROVIDER=huggingface.
# CI and production (OpenAI embeddings) do NOT need these.
embeddings-local = [
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-postprocessor-flag-embedding-reranker>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[project.scripts]
aifactory = "aifactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifactory"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    ".cache/",
    "dist/",
    "htmlcov/",
    ".coverage",
    "*.egg-info/",
    "tests/",
    "docs/",
    "scripts/",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
