[project]
name = "aifactory"
version = "0.1.0"
description = "Self-assembling, self-optimising AI agent factory that turns raw ideas into production-grade output"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag" }]

dependencies = [
    # Orchestration
    "langgraph",
    "llama-index",
    # Observability
    "langsmith",
    # LLM providers (unified interface)
    "litellm[google]",
    # Structured output & validation
    "pydantic[email]",
    "pydantic-settings",
    # Vector DB (memory layers)
    "qdrant-client",
    # Async & concurrency
    "anyio",
    # Config
    "pyyaml",
    "python-dotenv",
    # Utilities
    "rich", # Beautiful terminal output
    "typer", # CLI framework
    "tiktoken", # Token counting
    "tenacity", # Retry logic
    # Researcher tools
    "httpx",
    "beautifulsoup4",
    "duckduckgo-search",
    # HTTP API (Render deployment)
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "slowapi",
    # Persistence
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg2-binary",
    "redis",
    # Auth
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    # Code execution sandbox (E2B)
    "e2b-code-interpreter>=2.6.0",
    "docker>=7.1.0",
    # MCP (Model Context Protocol) — external tool servers
    "mcp",
    "cryptography>=46.0.6",
    "bcrypt>=5.0.0",
    "prompt-toolkit>=3.0.52",
    "langgraph-checkpoint-postgres",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
#    "pre-commit>=4.0.0",
]
integrations = [
    "composio>=0.7",
    "httpx>=0.27",
    "mcp>=1.0",
]
milvus = [
    "milvus-lite>=3.2.1",
    "pymilvus>=3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    #    "pre-commit>=4.0.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
aifactory = "aifactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifactory"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    ".cache/",
    "dist/",
    "htmlcov/",
    ".coverage",
    "*.egg-info/",
    "tests/",
    "docs/",
    "scripts/",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["agent-arch/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"src/aifactory/core/model_selector.py" = ["RUF001", "RUF002", "RUF003"]
"manage.py" = ["E501"]
"src/aifactory/cli/cmd_cost.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/cli/cmd_serve.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/config/settings.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/complexity_gate.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/model_calibrator.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/retry.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/rl_scorer.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/run_store.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/sandbox_pool.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/semantic_cache.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/semantic_classifier.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/dynamic_pipeline.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/checkpointer.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/state_v2.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/worker_node.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/planner_node.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/graphs/graph_compiler.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/milvus_store.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/core/memory_router.py" = ["RUF001", "RUF002", "RUF003"]
"src/aifactory/integrations/providers/mcp_provider.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_retry.py" = ["RUF001", "RUF002", "RUF003"]
"tests/*" = ["S101"]  # pytest convention: bare `assert` is standard
"scripts/smoke_test.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/test_gate_edges.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
