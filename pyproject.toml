[project]
name = "aifactory"
version = "0.1.0"
description = "Self-assembling, self-optimising AI agent factory that turns raw ideas into production-grade output"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag" }]

dependencies = [
    # Orchestration
    "langgraph",
    "llama-index",
    # Observability
    "langsmith",
    # LLM providers (unified interface)
    "litellm",
    # Structured output & validation
    "pydantic",
    "pydantic-settings",
    # Vector DB (memory layers)
    "qdrant-client",
    # Async & concurrency
    "anyio",
    # Config
    "pyyaml",
    "python-dotenv",
    # Utilities
    "rich", # Beautiful terminal output
    "typer", # CLI framework
    "tiktoken", # Token counting
    "tenacity", # Retry logic
    # HTTP API (Render deployment)
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "slowapi>=0.1.9",
    # Persistence
    "sqlalchemy[asyncio]",
    "asyncpg",
    "redis",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
#    "pre-commit>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
#    "pre-commit>=4.0.0",
]

[project.scripts]
aifactory = "aifactory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifactory"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    ".cache/",
    "dist/",
    "htmlcov/",
    ".coverage",
    "*.egg-info/",
    "tests/",
    "docs/",
    "scripts/",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
